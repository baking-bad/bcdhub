version: "2"
run:
  go: "1.27"

linters:
  enable:
    - containedctx
    - copyloopvar
    - goconst
    - gocritic
    - gosec
    - makezero
    - mirror
    - misspell
    - musttag
    - noctx
    - prealloc
    - protogetter
    - tagalign
    - unconvert
    - zerologlint
  settings:
    goconst:
      match-constant: true
      min-len: 3
      min-occurrences: 3
      ignore-calls: true
      ignore-map-keys: true
      numbers: false
      min: 3
      max: 3
      find-duplicates: false
      eval-const-expressions: false
      ignore-tests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
