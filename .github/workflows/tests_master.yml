name: Test
permissions:
  contents: read
  pull-requests: read
on:
  push:
    branches:
      - master

jobs:
  golangci:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.4'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          args: --timeout=5m
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.4'
          cache: true
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: golang tests
        env:
          GO111MODULE: on
          BCD_ENV: production
        run: |
          go mod download
          go test ./...
      - name: golang tests (indexer build tags)
        env:
          GO111MODULE: on
          BCD_ENV: production
        run: go test -tags=jsoniter_sloppy ./internal/noderpc/... ./internal/bcd/... ./internal/parsers/... ./cmd/indexer/...
